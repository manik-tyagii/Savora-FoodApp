<?xml version="1.0" encoding="UTF-8"?>
<!-- Cinematic-style friendly character avatar (original artwork) -->
<svg width="160" height="160" viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg" fill="none">
    <defs>
        <radialGradient id="bg" cx="50%" cy="40%">
            <stop offset="0%" stop-color="#3A302B" />
            <stop offset="100%" stop-color="#171311" />
        </radialGradient>
        <linearGradient id="skin" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#FFDDB3" />
            <stop offset="100%" stop-color="#F4BD85" />
        </linearGradient>
        <linearGradient id="hair" x1="0" x2="1">
            <stop offset="0%" stop-color="#352B28" />
            <stop offset="100%" stop-color="#12100F" />
        </linearGradient>
        <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="b" />
            <feMerge>
                <feMergeNode in="b" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <style>
            .pan { animation: stir 1.6s ease-in-out infinite; transform-origin: 86px 119px; }
            .food { animation: toss 1.6s ease-in-out infinite; transform-origin: 86px 112px; }
            .steam { animation: steam 1.8s ease-in-out infinite; transform-origin: center; }
            @keyframes stir { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(7deg); } }
            @keyframes toss { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
            @keyframes steam { 0%, 100% { opacity: 0.15; transform: translateY(3px); } 50% { opacity: 0.85; transform: translateY(-4px); } }
        </style>
    </defs>

    <!-- background glow -->
    <rect x="8" y="8" width="144" height="144" rx="20" fill="url(#bg)" />

    <!-- large soft vignette -->
    <ellipse cx="80" cy="84" rx="48" ry="48" fill="#4B3B32" opacity="0.58" filter="url(#soft)" />

    <!-- chef jacket, collar, and cooking arms -->
    <path d="M39 145c2-24 10-38 25-42h32c15 4 23 18 25 42z" fill="#FFF" stroke="#E8B07A" stroke-width="1.2" />
    <path d="M64 103l16 16 16-16" fill="#E76F51" stroke="#D85B3F" stroke-width="1" />
    <path d="M80 119v26" stroke="#D7E6ED" stroke-width="1.4" />
    <circle cx="80" cy="126" r="2" fill="#173F5F" />
    <circle cx="80" cy="137" r="2" fill="#173F5F" />
    <g class="cooking-arm">
        <path d="M47 111c-12 5-16 15-18 25" stroke="#FFF" stroke-width="9" stroke-linecap="round" />
        <path d="M113 111c12 5 16 15 18 25" stroke="#FFF" stroke-width="9" stroke-linecap="round" />
        <circle cx="29" cy="137" r="6" fill="url(#skin)" />
        <circle cx="131" cy="137" r="6" fill="url(#skin)" />
    </g>

    <!-- head -->
    <g transform="translate(40,36)">
        <ellipse cx="40" cy="36" rx="30" ry="34" fill="url(#skin)" stroke="#C98F63" stroke-width="1" />

        <!-- hair -->
        <path d="M10 29c2-22 18-31 35-29 17 1 29 12 28 29-7-9-15-15-28-16-14-2-26 4-35 16z" fill="url(#hair)" opacity="0.98" />
        <path d="M15 19c8-12 22-17 39-13" stroke="#62463A" stroke-width="3" stroke-linecap="round" opacity="0.7" />

        <!-- eyes realistic -->
        <g transform="translate(0,0)">
            <path d="M18 26c5-3 10-3 15 0" stroke="#4A2D1D" stroke-width="2.5" stroke-linecap="round" />
            <path d="M47 26c5-3 10-3 15 0" stroke="#4A2D1D" stroke-width="2.5" stroke-linecap="round" />
            <ellipse cx="26" cy="32" rx="5" ry="4.8" fill="#fff" />
            <ellipse cx="54" cy="32" rx="5" ry="4.8" fill="#fff" />
            <circle cx="26" cy="33" r="2" fill="#2B2B2B" />
            <circle cx="54" cy="33" r="2" fill="#2B2B2B" />
            <circle cx="24" cy="31" r="0.8" fill="#fff" opacity="0.9" />
            <circle cx="52" cy="31" r="0.8" fill="#fff" opacity="0.9" />
        </g>

        <!-- nose subtle -->
        <path d="M40 36c0 1.8-1.2 3-2.2 3" stroke="#C67A42" stroke-width="1.2"
            stroke-linecap="round" />

        <!-- full professional beard and smile -->
        <path d="M12 39c5 3 10 4 16 3 5-1 9-1 12 2 3-3 7-3 12-2 6 1 11 0 16-3-1 19-12 30-28 30S13 58 12 39z" fill="#4A2D24" opacity="0.98" />
        <path d="M25 47c5-4 10 0 15 2 5-2 10-6 15-2-1 6-8 8-15 4-7 4-14 2-15-4z" fill="#35221D" />
        <path d="M34 57c4 3 9 3 13 0" stroke="#D87552" stroke-width="2" stroke-linecap="round" fill="none" />

        <!-- chef hat cinematic -->
        <g transform="translate(6,-8)">
            <path d="M20 10c10-8 40-8 56 0v6c0 8-6 12-28 12-26 0-28-10-28-12v-6z" fill="#FFF"
                stroke="#FDE68A" stroke-width="1" />
            <rect x="28" y="18" width="16" height="6" rx="3" fill="#FFF" stroke="#FDE68A"
                stroke-width="1" />
        </g>

    </g>

    <!-- small plate shadow -->
    <ellipse cx="80" cy="126" rx="36" ry="8" fill="#F4B05A" opacity="0.28" />

    <!-- animated cooking pan and fresh steam -->
    <g class="pan">
        <ellipse cx="86" cy="119" rx="25" ry="7" fill="#173F5F" />
        <path d="M108 118h22" stroke="#173F5F" stroke-width="5" stroke-linecap="round" />
        <ellipse cx="86" cy="116" rx="20" ry="5" fill="#E76F51" />
    </g>
    <g class="food">
        <circle cx="78" cy="114" r="3" fill="#F6BD60" />
        <circle cx="88" cy="112" r="3" fill="#2A9D8F" />
        <circle cx="96" cy="115" r="3" fill="#F6BD60" />
    </g>
    <g class="steam" fill="none" stroke="#FFF9F1" stroke-width="2.5" stroke-linecap="round">
        <path d="M76 103c-5-5 5-7 0-12" />
        <path d="M87 101c-5-5 5-8 0-13" />
        <path d="M98 103c-5-5 5-7 0-12" />
    </g>
</svg>